# =============================================================
#  Linux Backup Automation System (LBAS) - Configuration
#  BASE_DIR is set by lbas.sh (the project folder).
# =============================================================

# Folders/files to back up (absolute paths). Add as many as you like:
# SOURCES=("/home/student/Documents" "/home/student/Projects")
SOURCES=("$BASE_DIR/source")

# Where LBAS keeps its data
BACKUP_DIR="$BASE_DIR/backups"      # compressed archives + .sha256 files
SNAP_DIR="$BASE_DIR/snapshots"      # tar snapshot files for incremental backups
LOG_DIR="$BASE_DIR/logs"            # lbas.log, alerts.log, cron.log
REPORT_DIR="$BASE_DIR/reports"      # one report per backup run
RESTORE_DIR="$BASE_DIR/restored"    # default restore destination (safe)
LOCK_FILE="$SNAP_DIR/.lbas.lock"    # same file for manual runs and cron

# Retention policy
KEEP_CHAINS=3          # keep the last 3 full backups (each with its incrementals)
MAX_INCREMENTALS=6     # after 6 incrementals, the smart mode makes a new full backup
KEEP_REPORTS=30        # number of report files to keep

# Monitoring
STORAGE_WARN_PERCENT=80   # warn when the backup disk is this % full

# Patterns that are never backed up
EXCLUDES=("*.tmp" "*.swp" "*.cache" ".Trash*")
